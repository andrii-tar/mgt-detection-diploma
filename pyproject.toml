[project]
name = "text-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "pandas>=3.0.3",
    "pyarrow>=18.0.0",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    "transformers>=5.13.1",
    "tqdm>=4.66.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
