[project]
name = "text-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "gguf>=0.17.1",
    "pandas>=3.0.3",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5",
    "torch>=2.6.0",
    "transformers>=5.13.1",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
bayesian = [
    "pymc>=5.0",
]
notebook = [
    "interpret>=0.7.8",
    "jupyter>=1.1.1",
    "jupyter-collaboration>=3.1.2",
    "matplotlib>=3.10.0,<3.11",
    "numpy",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
