sync:
  td-code:
    alpha: .
    beta: linux-box:/workspace/text-detection
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*"
        - "!scripts"
        - "!scripts/**"
        - "!pyproject.toml"
        - "!uv.lock"
        - "scripts/**/__pycache__"
        - "scripts/**/*.pyc"
        - "!.env.linux"

  raw-data-upload:
    alpha: D:/Projects/master_diploma/text-detection-data/
    beta: linux-box:/workspace/text-detection/data/
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*"
        - "!raw"
        - "!raw/kaggle_train"
        - "!raw/kaggle_train/**"
        - "!raw/outfox_chatgpt_train"
        - "!raw/outfox_chatgpt_train/**"

  processed-states-upload:
    alpha: D:/Projects/master_diploma/text-detection-data/processed/
    beta: linux-box:/workspace/text-detection/data/processed/
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*"
        - "!*/"
        - "!**/"
        - "!**/state.json"
        - "!**/similarity_state.json"

  data-download:
    alpha: linux-box:/workspace/text-detection/data/
    beta: D:/Projects/master_diploma/text-detection-data/
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*.tmp"
        - "**/*.tmp"
        - "*.parquet.tmp"
        - "**/*.parquet.tmp"
