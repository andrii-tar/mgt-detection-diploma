sync:
  td-code:
    alpha: .
    beta: linux-box:/workspace/text-detection
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*"
        - "!scripts"
        - "!scripts/**"
        - "!pyproject.toml"
        - "!uv.lock"
        - "scripts/**/__pycache__"
        - "scripts/**/*.pyc"
        - "!.env.linux"

  raw-data-upload:
    alpha: D:/Projects/master_diploma/text-detection-data/
    beta: linux-box:/workspace/text-detection/data/
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*"
        - "!raw"
        - "!raw/kaggle_train"
        - "!raw/kaggle_train/**"
        - "!raw/MAGE/train/**"
        - "!raw/outfox"
        - "!raw/outfox/outfox_chatgpt_train_HG.csv"
        - "!raw/outfox/outfox_chatgpt_train_MG.csv"
        - "!raw/semevals_2024-task8"
        - "!raw/semevals_2024-task8/SemEval2024-task8"
        - "!raw/semevals_2024-task8/SemEval2024-task8/subtaskC"
        - "!raw/semevals_2024-task8/SemEval2024-task8/subtaskC/**"
        - "!raw/bbc_news"
        - "!raw/bbc_news/bbc_news_content_HG.csv"
        - "!raw/custom"
        - "!raw/custom/samples_2025"
        - "!raw/custom/samples_2025/custom_2025_HG.csv"
        - "!raw/custom/samples_2025/custom_2025_MG.csv"

  processed-states-upload:
    alpha: D:/Projects/master_diploma/text-detection-data/processed/
    beta: linux-box:/workspace/text-detection/data/processed/
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*"
        - "!*/"
        - "!**/"
        - "!**/state.json"
        - "!**/similarity_state.json"

  data-download:
    alpha: linux-box:/workspace/text-detection/data/
    beta: D:/Projects/master_diploma/text-detection-data/
    mode: one-way-safe
    ignore:
      vcs: true
      paths:
        - "*.tmp"
        - "**/*.tmp"
        - "*.parquet.tmp"
        - "**/*.parquet.tmp"
