services:
  grafana:
    image: grafana/grafana:latest
    container_name: text-detection-grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  progress-states:
    image: python:3.12-slim
    container_name: text-detection-progress-states
    restart: unless-stopped
    working_dir: /workspace
    environment:
      TEXT_DETECTION_DATA: /data
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace:ro
      - ${TEXT_DETECTION_DATA:?Set TEXT_DETECTION_DATA to your external data directory}:/data:ro
    command: >
      sh -c "python monitoring/scripts/export_processing_states.py
      --processed-root /data/processed
      --output /tmp/processing-states.json
      --watch &
      python -m http.server 8000 --directory /tmp"

volumes:
  grafana-data:
